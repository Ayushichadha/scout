arch:
  name: hrm.hrm_act_v1@HierarchicalReasoningModel_ACTV1
  loss:
    name: losses@ACTLossHead
    loss_type: stablemax_cross_entropy
    feudal_loss_weight: 0.05
    intervention_weight: 0.0
  halt_exploration_prob: 0.1
  halt_max_steps: 4
  fixed_refinement_steps: 8
  H_cycles: 1
  L_cycles: 1
  H_layers: 1
  L_layers: 1
  hidden_size: 32
  num_heads: 2
  expansion: 2
  puzzle_emb_ndim: 32
  pos_encodings: rope
  subgoal_head:
    hidden_size: 32
    goal_dim: 32
    manager_period: 4
    temperature: 1.0
    projection_bias: true
    normalize_goal: true
    goal_scale: 1.0
    gating: true
    detach_goals: true
    inject_subgoal: true
    use_alignment_loss: true
    random_directions: false
    directional_displacement: true
    initial_goal_only: false
    replan_mode: adaptive
    trigger_threshold: 0.5
    trigger_stochastic_train: true
data_path: data/conceptarc-mini
device: cpu
max_steps: 96
enable_wandb: false
seed: 0
run_summary_path: null
quick_overfit: false
quick_max_steps: 15
quick_batch_size: 16
quick_arch:
  hidden_size: 32
  n_layers: 1
  n_heads: 2
global_batch_size: 4
epochs: 1
eval_interval: null
checkpoint_every_eval: true
overfit_one_batch: false
lr: 0.0001
lr_min_ratio: 1.0
lr_warmup_steps: 0
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
puzzle_emb_weight_decay: 0.1
puzzle_emb_lr: 0.01
final_eval: true
checkpoint_path: /Users/ayushi/Documents/hrm_research/experiments/meta_agents_adaptive_sanity/20260816T144122Z_adaptive_eta0_seed0_96step_sanity/checkpoints
project_name: meta_agents_adaptive_sanity
run_name: adaptive_eta0_seed0_100step_sanity
